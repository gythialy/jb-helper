version: '3.8'

services:
  jbhelper:
    build:
      context: .
      dockerfile: Dockerfile
    image: jbhelper:latest
    container_name: jbhelper
    ports:
      - "10800:10800"
    volumes:
      - ./cert:/app/cert
    environment:
      - BASE_PATH=/app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
networks:
  default:
    name: jbhelper-network

volumes:
  cert_data:
    driver: local
